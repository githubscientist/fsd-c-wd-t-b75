<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tailwind CSS</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div class="grid grid-cols-4 grid-rows-6">
            <div class="bg-[#53d5ec] p-4 text-white mb-2 col-start-1 col-end-5 flex justify-center">

            </div>

                    <div>
                        <img src="./image copy.png" alt="" class="w-full">
                    </div>

                    <div class="p-4">
                        <h2 class="text-2xl font-bold">Master Data Science Course with IITM Pravartak Certification</h2>
                    </div>

                    <div class="p-4">
                        <p>
                            Tamil, English & Hindi
                        </p>
                    </div>

                    <div class="p-4 grid grid-cols-2 gap-2">
                        <input type="button" value="Syllabus" class="border py-2 px-4 hover:bg-black hover:text-white">
