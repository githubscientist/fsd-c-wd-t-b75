<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Tailwind CSS</title>
        <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    </head>

    <body>
        <div class="grid grid-cols-4 grid-rows-6">
            <div class="bg-[#53d5ec] p-4 text-white mb-2 col-start-1 col-end-5 flex justify-center">
                <p>Header</p>
            </div>

            <div class="bg-[#9fc360] p-4 text-white mb-2 row-start-2 row-end-6">
                <p>Sidebar</p>
            </div>

            <div
                class="bg-[#f5c531] p-4 text-white mb-2 col-start-2 col-end-5 row-start-2 row-end-5 flex justify-center items-center">
                <p>Main Content</p>
            </div>

            <div class="bg-[#898989] p-4 text-white mb-2 col-start-2 col-end-5">
                <p>Extra Content</p>
            </div>

            <div class="bg-[#ffa500] p-4 text-white mb-2 col-start-1 col-end-5">
                <p>Footer</p>
            </div>
        </div>
    </body>

</html>
